# For Portainer (or any Docker host without a clone or git): ready-made images are pulled from GitHub Container Registry
# (built by .github/workflows/docker.yml on every push to main). Nothing is built on the host.
# All persistent data lives in DATA_DIR on the NAS and survives updates:
#   $DATA_DIR/data    user data (SQLite)
#   $DATA_DIR/web     web files (refreshed from GitHub on every start)
#   $DATA_DIR/nginx   nginx config (refreshed from GitHub on every start)
# Set DATA_DIR (an absolute folder on the host) and optionally WEB_PORT in the stack's environment variables.
services:
  setup:
    image: ghcr.io/sbarrak/electricityfinland-setup:latest
    pull_policy: always
    restart: "no"
    volumes:
      - ${DATA_DIR:?set DATA_DIR in the stack environment variables}/web:/target/web
      - ${DATA_DIR:?set DATA_DIR in the stack environment variables}/nginx:/target/nginx
  app:
    image: ghcr.io/sbarrak/electricityfinland-app:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - ${DATA_DIR:?set DATA_DIR in the stack environment variables}/data:/data
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      setup:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-8088}:80"
    volumes:
      - ${DATA_DIR:?set DATA_DIR in the stack environment variables}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_DIR:?set DATA_DIR in the stack environment variables}/web:/usr/share/nginx/html:ro
