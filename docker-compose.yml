services:
  app:
    build: https://github.com/sbarrak/electricityfinland.git#main:app
    restart: unless-stopped
    env_file:
      - path: stack.env
        required: false
      - path: .env
        required: false
    volumes:
      - ./data:/data
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${WEB_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
